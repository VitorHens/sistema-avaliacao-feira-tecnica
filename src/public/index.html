<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Feira Técnica</title>
  <link href="/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { min-height: 100vh; background: linear-gradient(135deg, #0d6efd, #6610f2); }
    .login-card { width: min(100% - 2rem, 430px); border: 0; border-radius: 1.25rem; }
    .brand-icon { width: 64px; height: 64px; display: grid; place-items: center; border-radius: 1rem; background: #e7f1ff; font-size: 2rem; }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center py-5">
  <main class="card login-card shadow-lg">
    <div class="card-body p-4 p-md-5">
      <div class="brand-icon mx-auto mb-3" aria-hidden="true">🎓</div>
      <h1 class="h3 text-center mb-2">Feira Técnica</h1>
      <p class="text-secondary text-center mb-4">Entre para gerenciar projetos e avaliações.</p>

      <div id="mensagem" class="alert d-none" role="alert"></div>

      <form id="formLogin" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label">E-mail</label>
          <input id="email" name="email" type="email" class="form-control form-control-lg" autocomplete="username" required>
        </div>
        <div class="mb-4">
          <label for="senha" class="form-label">Senha</label>
          <input id="senha" name="senha" type="password" class="form-control form-control-lg" autocomplete="current-password" required>
        </div>
        <button id="entrar" class="btn btn-primary btn-lg w-100" type="submit">Entrar</button>
      </form>
    </div>
  </main>

  <script type="module">
    import ApiService from './ApiService.js';

    const api = new ApiService();
    const form = document.getElementById('formLogin');
    const mensagem = document.getElementById('mensagem');
    const botao = document.getElementById('entrar');

    const exibirMensagem = (texto, tipo = 'danger') => {
      mensagem.textContent = texto;
      mensagem.className = `alert alert-${tipo}`;
    };

    form.addEventListener('submit', async (evento) => {
      evento.preventDefault();

      if (!form.checkValidity()) {
        form.classList.add('was-validated');
        return;
      }

      botao.disabled = true;
      botao.textContent = 'Entrando...';
      mensagem.className = 'alert d-none';

      try {
        const resposta = await api.post('/api/v1/professores/login', {
          professor: {
            email: form.email.value.trim(),
            senha: form.senha.value
          }
        });

        if (!resposta.success || !resposta.data?.token) {
          throw new Error(resposta.message || 'Não foi possível entrar.');
        }

        localStorage.setItem('authData', JSON.stringify(resposta.data));
        localStorage.setItem('token', resposta.data.token);
        window.location.href = '/dashboard.html';
      } catch (erro) {
        exibirMensagem(erro.message || 'Erro ao conectar com o servidor.');
      } finally {
        botao.disabled = false;
        botao.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
