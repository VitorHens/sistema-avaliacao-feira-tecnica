<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel | Feira Técnica</title>
  <link href="/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-primary shadow-sm">
    <div class="container">
      <span class="navbar-brand fw-semibold">🎓 Feira Técnica</span>
      <button id="sair" class="btn btn-outline-light" type="button">Sair</button>
    </div>
  </nav>

  <main class="container py-5">
    <div class="p-4 p-md-5 bg-white rounded-4 shadow-sm">
      <p class="text-primary fw-semibold mb-2">PAINEL DO PROFESSOR</p>
      <h1 id="boasVindas" class="display-6 fw-bold">Bem-vindo!</h1>
      <p class="lead text-secondary mb-0">Use o sistema para acompanhar os projetos e registrar avaliações da Feira Técnica.</p>
    </div>
  </main>

  <script>
    const authData = JSON.parse(localStorage.getItem('authData') || 'null');
    const token = localStorage.getItem('token');

    if (!authData || !token) {
      window.location.replace('/');
    } else {
      const nome = authData.professor?.nome || authData.professor?.name || 'Professor';
      document.getElementById('boasVindas').textContent = `Bem-vindo, ${nome}!`;
    }

    document.getElementById('sair').addEventListener('click', () => {
      localStorage.removeItem('authData');
      localStorage.removeItem('token');
      window.location.replace('/');
    });
  </script>
</body>
</html>
